<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote for Your Favorite Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-4">Vote for a Team</h2>

        <form method="POST" class="space-y-4">
            <label class="block text-gray-700 font-semibold">Select Team:</label>
            <select name="team" class="w-full p-2 border rounded">
                {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                {% endfor %}
            </select>

            <div>
                <label class="block text-gray-700 font-semibold">Amazement (1-10):</label>
                <input type="number" name="amazement" min="1" max="5" required class="w-full p-2 border rounded">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold">Quality (1-10):</label>
                <input type="number" name="quality" min="1" max="5" required class="w-full p-2 border rounded">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold">Delivery (1-10):</label>
                <input type="number" name="delivery" min="1" max="5" required class="w-full p-2 border rounded">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold">Overall Design (1-10):</label>
                <input type="number" name="design" min="1" max="5" required class="w-full p-2 border rounded">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Submit Vote</button>
        </form>
    </div>

</body>
</html>
