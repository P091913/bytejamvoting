<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-4">Voting Settings</h2>

        <form method="POST" action="/save_voting_settings" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold">Voting Start Date & Time:</label>
                <input type="datetime-local" name="voting_start" required class="w-full p-2 border rounded">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold">Voting End Date & Time:</label>
                <input type="datetime-local" name="voting_end" required class="w-full p-2 border rounded">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Save Settings</button>
        </form>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-4">Clear Data Settings</h2>

    <form method="POST" action="/delete_data" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-semibold">
                <input type="checkbox" name="delete_teams" class="mr-2"> Delete all teams
            </label>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold">
                <input type="checkbox" name="delete_companies" class="mr-2"> Delete all companies
            </label>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold">
                <input type="checkbox" name="delete_votes" class="mr-2"> Delete all votes
            </label>
        </div>

        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Delete Selected Data</button>
    </form>
</div>


</body>
</html>
